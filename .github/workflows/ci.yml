name: CI

on:
  push:
  pull_request:
    branches:
      - main

# The npm-generated admin app and the Go API are the active product; CI covers
# only these maintained applications.
jobs:
  api-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-trixie
        env:
          POSTGRES_USER: rota
          POSTGRES_PASSWORD: pa55word
          POSTGRES_DB: rota
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U rota -d rota"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Run API vet
        working-directory: api
        run: go vet ./...

      - name: Run API tests
        working-directory: api
        run: go test ./...

      - name: Build API
        working-directory: api
        run: go build ./...

      - name: Apply migrations for integration tests
        run: |
          docker build -t rota-migrate ./api/migrations
          docker run --rm --network host \
            -e PGHOST=127.0.0.1 -e PGPORT=5432 -e PGDATABASE=rota \
            -e PGUSER=rota -e PGPASSWORD=pa55word -e PGSSLMODE=disable \
            rota-migrate up

      - name: Run API integration tests
        working-directory: api
        env:
          TEST_POSTGRES_DSN: postgres://rota:pa55word@localhost:5432/rota?sslmode=disable
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: rota
          POSTGRES_PASSWORD: pa55word
          POSTGRES_DB: rota
        # Integration packages share this disposable database and reset
        # common state; serialize packages to prevent fixture interference.
        run: go test -p 1 -tags=integration ./...

  admin-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: admin/pnpm-lock.yaml

      - name: Install admin dependencies
        working-directory: admin
        run: pnpm install --frozen-lockfile

      - name: Run admin lint
        working-directory: admin
        run: pnpm lint

      - name: Run admin typecheck
        working-directory: admin
        run: pnpm check

      - name: Run admin tests
        working-directory: admin
        run: pnpm test

      - name: Build admin
        working-directory: admin
        run: pnpm build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        run: docker build -t rota-api ./api
      - name: Build admin image
        run: docker build -t rota-admin ./admin
      - name: Build migration image
        run: docker build -t rota-migrate ./api/migrations

  migrations-roundtrip:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-trixie
        env:
          POSTGRES_USER: rota
          POSTGRES_PASSWORD: pa55word
          POSTGRES_DB: rota
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U rota -d rota"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
      - name: Build migration image
        run: docker build -t rota-migrate ./api/migrations
      - name: Run migration roundtrip
        shell: bash
        run: |
          set -euo pipefail
          migration_env=(
            --network host
            -e PGHOST=127.0.0.1 -e PGPORT=5432 -e PGDATABASE=rota
            -e PGUSER=rota -e PGPASSWORD=pa55word -e PGSSLMODE=disable
          )
          docker run --rm "${migration_env[@]}" rota-migrate up
          docker run --rm "${migration_env[@]}" rota-migrate down 1
          docker run --rm "${migration_env[@]}" rota-migrate up

          latest_version="$(find api/migrations -maxdepth 1 -type f -name '*.up.sql' -printf '%f\n' \
            | sort -V | tail -n1 | cut -d_ -f1 | sed 's/^0*//')"
          latest_version="${latest_version:-0}"
          current_version="$(docker run --rm "${migration_env[@]}" --entrypoint migrate rota-migrate \
            -path=/migrations -database="postgres://rota:pa55word@127.0.0.1:5432/rota?sslmode=disable" version 2>&1 \
            | tail -n1 | tr -d '[:space:]')"
          if [[ "$current_version" != "$latest_version" ]]; then
            echo "expected migration version $latest_version, got $current_version"
            exit 1
          fi

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: Install pinned govulncheck
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          GOBIN="${RUNNER_TEMP}/bin" go install golang.org/x/vuln/cmd/govulncheck@v1.2.0
      - name: Scan API dependencies and reachable symbols
        working-directory: api
        run: "${RUNNER_TEMP}/bin/govulncheck" ./...
